name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files to VPS via rsync
        run: |
          # Sync files to /opt/mevabot (preserving .env and data/ database)
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'node_modules' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mevabot/

      - name: Install production dependencies & restart systemd
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /opt/mevabot
            npm ci --omit=dev
            
            # Ensure permissions are correct
            id -u mevabot &>/dev/null || useradd -r -s /sbin/nologin mevabot
            chown -R mevabot:mevabot /opt/mevabot
            mkdir -p /opt/mevabot/data
            chown -R mevabot:mevabot /opt/mevabot/data
            chmod 700 /opt/mevabot/data
            [ -f /opt/mevabot/.env ] && chmod 600 /opt/mevabot/.env

            # Copy systemd service if changed and restart
            cp /opt/mevabot/mevabot.service /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable mevabot
            systemctl restart mevabot
          EOF
